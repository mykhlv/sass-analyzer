name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check version consistency
        run: |
          cargo_ver=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          pkg_ver=$(node -p "require('./editors/code/package.json').version")
          if [ "$cargo_ver" != "$pkg_ver" ]; then
            echo "::error::Version mismatch: Cargo.toml=$cargo_ver, package.json=$pkg_ver"
            exit 1
          fi
          echo "Versions in sync: $cargo_ver"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - working-directory: editors/code
        run: npm ci
      - working-directory: editors/code
        run: npm run lint
      - working-directory: editors/code
        run: npm run build

  sass-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache sass-spec corpus
        uses: actions/cache@v4
        with:
          path: test-corpus/sass-spec
          key: sass-spec-63a0becd13d3639a60669d8b710e75b282415047
      - name: Download corpus
        run: bash test-corpus/download.sh sass-spec
      - name: Run sass-spec compatibility
        run: cargo test -p sass-parser --test sass_spec_test -- --ignored --nocapture
      - name: Fail on compliance drift
        run: |
          if ! git diff --exit-code -- test-corpus/sass-spec-gaps.txt \
                                        test-corpus/sass-spec-sass-gaps.txt; then
            echo "::error::sass-spec compliance changed. Review the diff above and \
          commit the regenerated gap files if the change is an improvement."
            exit 1
          fi
